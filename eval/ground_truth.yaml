# ground_truth.yaml
# 10 QA pairs grounded in eval/fixtures/meridian_financials.txt
# Each question has a deterministic answer verifiable against the fixture.
#
# Fields:
#   question      — the question sent to the RAG /query endpoint
#   ground_truth  — the precise reference answer used for RAGAS context_recall scoring
#   category      — metric category for per-category breakdown reporting

- question: "What is the total annual revenue of Meridian Manufacturing Ltd for FY2024?"
  ground_truth: >
    The total annual revenue (turnover) of Meridian Manufacturing Ltd for FY2024
    was £4,200,000.
  category: income_statement

- question: "How many full-time equivalent employees did Meridian employ in FY2024?"
  ground_truth: >
    Meridian Manufacturing Ltd employed 42 full-time equivalent staff in FY2024,
    comprising 28 production operatives, 8 quality and engineering technicians,
    4 sales and account management professionals, and 2 senior management personnel.
  category: labour_efficiency

- question: "What was the gross margin percentage for FY2024?"
  ground_truth: >
    The gross margin for FY2024 was 40.0%. Gross profit was £1,680,000 on
    revenue of £4,200,000, with cost of goods sold of £2,520,000.
  category: income_statement

- question: "What is the company's current ratio as at 31 December 2024?"
  ground_truth: >
    The current ratio as at 31 December 2024 was 2.00, calculated as
    current assets of £890,000 divided by current liabilities of £445,000.
  category: financial_health

- question: "What was the total payroll cost and what percentage of revenue does it represent?"
  ground_truth: >
    The total payroll cost (staff wages and employer NI) was £1,050,000 in FY2024,
    representing 25.0% of total revenue of £4,200,000.
  category: labour_efficiency

- question: "What digital tools and software systems does Meridian Manufacturing use?"
  ground_truth: >
    Meridian Manufacturing uses five digital tools: SAP S/4HANA (ERP), Salesforce CRM,
    Microsoft 365 including Power BI, Keyence Vision Inspection Systems (automated
    optical inspection), and SYSPRO MES (Manufacturing Execution System).
  category: digital_maturity

- question: "What is the revenue per employee and how does it compare to the sector median?"
  ground_truth: >
    Revenue per employee is £100,000 (£4,200,000 / 42 employees). The sector P50
    benchmark is £98,000, placing Meridian slightly above the median at approximately
    the 55th percentile.
  category: labour_efficiency

- question: "What is the output per payroll ratio and what does it indicate?"
  ground_truth: >
    The output per payroll ratio is 4.00x (£4,200,000 revenue / £1,050,000 payroll).
    This exceeds the sector P50 of 3.7x, indicating moderate payroll efficiency
    relative to UK manufacturing SME peers.
  category: labour_efficiency

- question: "What are the total current assets and their breakdown?"
  ground_truth: >
    Total current assets were £890,000, comprising trade and other receivables
    (£520,000), inventories of raw materials and WIP (£290,000), and cash and
    cash equivalents (£80,000).
  category: financial_health

- question: "What is the digital maturity level of Meridian and what classification was assigned?"
  ground_truth: >
    Meridian was classified as HIGH digital maturity. The company operates five distinct
    digital tools — an integrated ERP (SAP S/4HANA), a CRM (Salesforce), automated
    inspection technology (Keyence), a manufacturing execution system (SYSPRO MES),
    and active data analytics via Power BI — which is above average for a UK SME
    of this size in the manufacturing sector.
  category: digital_maturity
